services:
  web:
    build:
      context: .
      dockerfile: Docker/Flask/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: niwatori
      DB_PASSWORD: cokecoke123
      DB_NAME: yorimichi

  db:
    build:
      context: .
      dockerfile: Docker/MySQL/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: yorimichi
      MYSQL_USER: niwatori
      MYSQL_PASSWORD: cokecoke123
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
