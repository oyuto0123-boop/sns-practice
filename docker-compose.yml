services:
  web:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: niwatori
      DB_PASSWORD: cokecoke123
      DB_NAME: yorimichi

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: yorimichi
      MYSQL_USER: niwatori
      MYSQL_PASSWORD: cokecoke123
    volumes:
      - db_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
  
volumes:
  db_data:
